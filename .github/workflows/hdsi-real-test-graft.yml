name: HDSI Real Test Graft

on:
  push:
    branches:
      - hdsi-r1r2-real-test-graft-20261010
      - hdsi-r1r2-core-graft-20261011
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate isolated branch baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "hdsi-r1r2-real-test-graft-20261010" || test "$GITHUB_REF_NAME" = "hdsi-r1r2-core-graft-20261011"
          git merge-base --is-ancestor bac4af1d4b84bfd3d8fae689f263f0b34e0fbd84 HEAD
          test "$(git hash-object src/database.ts)" = "d1ceae17cb7ede3b241d533179c343acc5c7dfe6"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
          cache: npm
      - name: Install
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund yuka@0.7.8 @koishijs/plugin-mock@2.6.6 msw@3.0.3 fast-check@4.10.2
          node -e "for(const [n,v] of Object.entries({'yuka':'0.7.8','@koishijs/plugin-mock':'2.6.6','msw':'3.0.3','fast-check':'4.10.2'})){const p=require(n+'/package.json');if(p.version!==v)throw Error(n+' version mismatch '+p.version);console.log('VERIFIED_PACKAGE',n,v)}"
          git diff --exit-code -- package.json package-lock.json
      - name: Verify candidate wiring, model behavior, and release build
        run: |
          npm run typecheck
          npm test
          npm run build
