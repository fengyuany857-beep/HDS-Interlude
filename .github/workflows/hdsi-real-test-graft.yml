name: HDSI Real Test Graft

on:
  push:
    branches:
      - hdsi-r1r2-real-test-graft-20261010
      - hdsi-r1r2-core-graft-20261011
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate isolated branch baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "hdsi-r1r2-real-test-graft-20261010" || test "$GITHUB_REF_NAME" = "hdsi-r1r2-core-graft-20261011"
          git merge-base --is-ancestor bac4af1d4b84bfd3d8fae689f263f0b34e0fbd84 HEAD
          test "$(git hash-object src/database.ts)" = "d1ceae17cb7ede3b241d533179c343acc5c7dfe6"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
          cache: npm
      - name: Install
        run: |
          npm ci --no-audit --no-fund
          node -e "for(const [n,v] of Object.entries({'yuka':'0.7.8','@koishijs/plugin-mock':'2.6.6','msw':'3.0.3','fast-check':'4.10.2','koishi-plugin-adapter-onebot':'6.9.4','@koishijs/plugin-adapter-satori':'1.5.1','@koishijs/plugin-http':'0.6.3','ws':'8.21.3'})){const p=require(n+'/package.json');if(p.version!==v)throw Error(n+' version mismatch '+p.version);console.log('VERIFIED_PACKAGE',n,v)}"
          git diff --exit-code -- package.json package-lock.json
      - name: Verify candidate wiring, model behavior, and release build
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Audit and verify reproducible clean Koishi install
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=high
          package_file="$(npm pack --silent | tail -n 1)"
          first_sum="$(sha256sum "$package_file" | cut -d ' ' -f 1)"
          package_file_again="$(npm pack --silent | tail -n 1)"
          second_sum="$(sha256sum "$package_file_again" | cut -d ' ' -f 1)"
          test "$package_file" = "$package_file_again"
          test "$first_sum" = "$second_sum"
          clean_dir="$(mktemp -d)"
          cp "$package_file" "$clean_dir/"
          cd "$clean_dir"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "./$package_file" koishi@4.18.11 @minatojs/driver-sqlite@4.7.0 @koishijs/plugin-http@0.6.3
          node - <<'NODE'
          const assert = require('node:assert/strict')
          const { App } = require('koishi')
          const { SQLiteDriver } = require('@minatojs/driver-sqlite')
          const httpModule = require('@koishijs/plugin-http')
          const plugin = require('koishi-plugin-hds-interlude')
          assert.equal(plugin.version, '1.0.1-rc36')
          assert.equal(typeof plugin.apply, 'function')
          ;(async () => {
            const app = new App()
            app.plugin(httpModule.default ?? httpModule)
            app.plugin(SQLiteDriver, { path: ':memory:' })
            app.plugin(plugin, {})
            await app.start()
            assert.ok(app.interlude)
            await app.stop()
            console.log('CLEAN_KOISHI_START_OK')
          })().catch(error => { console.error(error); process.exitCode = 1 })
          NODE
      - name: Bounded R1 fault and cross-process soak (60 cycles)
        shell: bash
        run: |
          set -euo pipefail
          for iteration in $(seq 1 60); do
            echo "R1_SOAK_CYCLE=$iteration"
            node --import tsx --test --test-name-pattern='real TCP reset|separate Node processes' test/r1-authorized-outbox-sqlite.test.ts
          done
