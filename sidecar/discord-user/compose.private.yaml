services:
  discord-user-sidecar:
    build:
      context: .
      dockerfile: Dockerfile
    image: hdsi-discord-user-sidecar:local
    profiles: ["phase-f-authorized"]
    ports:
      - "127.0.0.1:5140:5140"
    read_only: true
    init: true
    restart: unless-stopped
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    environment:
      HDSI_DISCORD_ROLE_ACCOUNT_ID: "${HDSI_DISCORD_ROLE_ACCOUNT_ID:?set exact role account ID}"
      HDSI_DISCORD_ALLOWED_USER_ID: "${HDSI_DISCORD_ALLOWED_USER_ID:?set exact allowed peer ID}"
      HDSI_DISCORD_TOKEN_FILE: /run/secrets/discord_user_token
      HDSI_BRIDGE_TOKEN_FILE: /run/secrets/local_bridge_token
      HDSI_SIDECAR_STATE_DIR: /var/lib/hdsi-discord
      HDSI_BRIDGE_PORT: "5140"
      HDSI_BRIDGE_BIND: "0.0.0.0"
    secrets:
      - source: discord_user_token
        target: discord_user_token
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: local_bridge_token
        target: local_bridge_token
        uid: "10001"
        gid: "10001"
        mode: 0400
    volumes:
      - discord-sidecar-state:/var/lib/hdsi-discord

secrets:
  discord_user_token:
    file: ${HDSI_DISCORD_TOKEN_FILE_HOST:?owner-only Discord token file required}
  local_bridge_token:
    file: ${HDSI_BRIDGE_TOKEN_FILE_HOST:?owner-only bridge token file required}

volumes:
  discord-sidecar-state:
    name: hdsi-discord-sidecar-state

